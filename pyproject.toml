[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customs"
version = "0.1.0"
description = "Agent-native dependency checkpoint: verify packages, repos and skills before a coding agent runs them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
customs = "customs.cli:main"

[tool.setuptools.packages.find]
include = ["customs*"]
